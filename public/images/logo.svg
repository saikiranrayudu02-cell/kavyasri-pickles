<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" fill="none">
  <!-- Traditional Clay Martaban Motif with crisp high-contrast container -->
  <g transform="translate(10, 10)">
    <!-- White Crisp Background Badge -->
    <circle cx="30" cy="30" r="28" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" opacity="0.95"/>
    
    <!-- Jar Base -->
    <path d="M16 28 C16 46, 20 54, 30 54 C40 54, 44 46, 44 28 Z" fill="#881337"/>
    <!-- Jar Shoulder & Cream top -->
    <path d="M18 28 C18 23, 22 20, 30 20 C38 20, 42 23, 42 28 Z" fill="#D97706"/>
    <!-- Neck -->
    <rect x="23" y="16" width="14" height="4" rx="2" fill="#451A03"/>
    <!-- Lid Knob -->
    <path d="M25 16 C25 12, 35 12, 35 16 Z" fill="#881337"/>
    <!-- Tied String Accent -->
    <path d="M20 20 Q30 23 40 20" stroke="#FFFBEB" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Traditional Sun/Spice Sparkle -->
    <path d="M30 31 L32 35 L36 36 L32 37 L30 41 L28 37 L24 36 L28 35 Z" fill="#F59E0B"/>
    <!-- Red Chilli Accent -->
    <path d="M42 42 C46 44, 48 48, 45 52 C43 51, 41 47, 42 42 Z" fill="#B91C1C"/>
    <path d="M45 42 C46 40, 48 39, 49 40" stroke="#15803D" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography with clear spacing between KAVYASRI and PICKLES & high-contrast color palette -->
  <text x="80" y="38" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="900" fill="#7F1D1D" letter-spacing="1">KAVYASRI</text>
  <text x="260" y="38" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="900" fill="#09090B" letter-spacing="1">PICKLES</text>
  
  <!-- Tagline -->
  <text x="82" y="56" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#27272A" letter-spacing="3.2">TRADITIONAL TASTE • HOMEMADE LOVE</text>

  <!-- Decorative separator line -->
  <line x1="82" y1="62" x2="415" y2="62" stroke="#7F1D1D" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 2"/>
</svg>
